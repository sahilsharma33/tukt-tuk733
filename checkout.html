<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Checkout</title>

  <style>

    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body{
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ec4899, #ec4899);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .checkout-box{
      background: white;
      width: 400px;
      padding: 35px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h1{
      text-align: center;
      margin-bottom: 25px;
      color: #333;
    }

    input,
    select{
      width: 100%;
      padding: 12px;
      margin: 12px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      transition: 0.3s;
    }

    input:focus,
    select:focus{
      border-color: #fe4fa4;
      outline: none;
      box-shadow: 0 0 5px rgba(79,172,254,0.5);
    }

    button{
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      background: #fe4fac;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover{
      background: #ff00dd;
      transform: scale(1.02);
    }

  </style>
</head>

<body></body>

  <div class="checkout-box">

    <h1>Checkout</h1>

    <input type="text" id="name" placeholder="Full Name">

    <input type="text" id="address" placeholder="Address">

    <input type="text" id="phone" placeholder="Phone">

    <select id="payment">
      <option value="COD">
        Cash On Delivery
      </option>

      <option value="Online">
        Online Payment
      </option>
    </select>

    <button onclick="placeOrder()">
      Place Order
    </button>

  </div>

  <script src="app.js"></script>

</body>
</html>
